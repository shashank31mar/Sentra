<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aegion — Access Control Plane</title>
  <link rel="icon" href="/favicon.svg" />
  <!-- Google Fonts allowed by the console CSP (style-src + font-src). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #010B13; --card: #050E16; --cyan: #0FFFFF; --pink: #FF0080;
      --ink: #FFFFFF; --line: rgba(255, 255, 255, 0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; position: relative;
    }
    /* faint cyan grid */
    .grid {
      position: fixed; inset: 0; z-index: 0; opacity: 0.04; pointer-events: none;
      background-image:
        linear-gradient(var(--cyan) 1px, transparent 1px),
        linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    /* radial vignette glow */
    .vignette {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 40%, rgba(15,255,255,0.06), transparent 60%);
    }
    .wrap { position: relative; z-index: 10; width: 100%; max-width: 28rem; margin: 0 1rem; }
    /* corner brackets */
    .bracket { position: absolute; width: 2rem; height: 2rem; pointer-events: none; }
    .bracket.tl { top: -1px; left: -1px; border-top: 2px solid rgba(15,255,255,0.4); border-left: 2px solid rgba(15,255,255,0.4); }
    .bracket.br { bottom: -1px; right: -1px; border-bottom: 2px solid rgba(255,0,128,0.4); border-right: 2px solid rgba(255,0,128,0.4); }
    .card {
      background: var(--card); border: 1px solid var(--line);
      padding: 2.75rem 2.5rem; position: relative; overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }
    /* scanline */
    .scanline {
      position: absolute; left: 0; right: 0; height: 2px; z-index: 20; pointer-events: none;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.06), transparent);
      animation: scan 5s linear infinite;
    }
    @keyframes scan { 0% { top: -2px; } 100% { top: 100%; } }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 2.25rem; }
    .logo-wrap { position: relative; margin-bottom: 1.25rem; width: 88px; height: 84px; display: grid; place-items: center; }
    .logo { width: 60px; height: 58px; filter: drop-shadow(0 0 18px rgba(15,255,255,0.75)); }
    .logo path { fill: var(--cyan); }
    .ring { position: absolute; inset: -10px; border: 1px solid rgba(15,255,255,0.30); border-radius: 999px; animation: ping 3s cubic-bezier(0,0,0.2,1) infinite; }
    .ring.r2 { inset: -22px; border-color: rgba(15,255,255,0.12); animation-delay: 1s; }
    @keyframes ping { 0% { transform: scale(0.85); opacity: 0.8; } 80%, 100% { transform: scale(1.25); opacity: 0; } }
    h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.04em; text-transform: uppercase; line-height: 1; }
    h1 .accent { color: var(--cyan); text-shadow: 0 0 15px rgba(15,255,255,0.8); }
    .tagline { font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em; color: rgba(255,255,255,0.7); margin-top: 1rem; font-weight: 700; }
    .badge { display: inline-flex; align-items: center; gap: 0.5rem; margin: 1.5rem auto 0; padding: 0.25rem 0.75rem; border: 1px solid rgba(15,255,255,0.2); background: rgba(15,255,255,0.05); }
    .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--cyan); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .badge span { font-size: 9px; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.15em; }
    /* CTA */
    .cta {
      display: block; width: 100%; margin-top: 2rem; padding: 1.15rem; text-align: center;
      border: 1px solid var(--cyan); background: transparent; color: var(--cyan);
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.2em; font-size: 12px; text-decoration: none; position: relative; overflow: hidden;
      box-shadow: 0 0 20px rgba(15,255,255,0.15); transition: box-shadow 0.3s; cursor: pointer;
    }
    .cta .fill { position: absolute; inset: 0; background: var(--cyan); transform: translateY(100%); transition: transform 0.3s ease-out; }
    .cta .label { position: relative; z-index: 10; transition: color 0.3s; }
    .cta:hover { box-shadow: 0 0 40px rgba(15,255,255,0.4); }
    .cta:hover .fill { transform: translateY(0); }
    .cta:hover .label { color: var(--bg); }
    .foot { text-align: center; margin-top: 1.5rem; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; color: rgba(255,255,255,0.4); font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="vignette"></div>
  <div class="wrap">
    <span class="bracket tl"></span>
    <span class="bracket br"></span>
    <div class="card">
      <div class="scanline"></div>
      <div class="brand">
        <div class="logo-wrap">
          <span class="ring"></span>
          <span class="ring r2"></span>
          <svg class="logo" viewBox="0 0 48 46" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
          </svg>
        </div>
        <h1>AEG<span class="accent">ION</span></h1>
        <p class="tagline">Runtime Control Plane for AI Agents</p>
        <div class="badge"><span class="dot"></span><span>Secure Channel · SOC</span></div>
      </div>
      <!-- Org-first entry (ADR-039). The CTA goes to the static org page, NOT
           straight to /overview: the operator identifies their organization
           first (public resolve_org → tenant_id stashed per-tab), then org.html
           bounces to /overview where the ALB presents Cognito sign-in and the
           server re-validates X-Aegion-Tenant ∈ memberships. A visitor who is
           already authenticated is skipped past the org page by org.html's own
           /whoami guard, so this lands them straight in the console. -->
      <a class="cta" href="/org.html">
        <span class="fill"></span>
        <span class="label">Access Control Plane →</span>
      </a>
      <p class="foot">Authorized Operators Only · All Activity Audited</p>
    </div>
  </div>
</body>
</html>
