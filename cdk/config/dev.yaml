# Sentra MVP - Development Environment Configuration
# IMPORTANT: This file is gitignored to prevent committing sensitive data
# Copy from dev.example.yaml and set environment variables:
#   export AWS_ACCOUNT_ID=your-account-id
#   export AWS_PROFILE=your-profile-name
#   export AWS_REGION=us-east-1

# AWS Account Configuration
# DO NOT commit actual account IDs - use environment variables
aws:
  account_id: null  # REQUIRED: Set via AWS_ACCOUNT_ID environment variable
  region: "us-east-1"         # Can be overridden by AWS_REGION env var
  profile: "sentra"           # Can be overridden by AWS_PROFILE env var

# Environment
environment: "dev"

# SSO Configuration (ADR-SSO). Governs how the SOC console authenticates operators.
# "alb-cognito" (default): the current ALB authenticate-cognito flow — no changes.
# "oidc": SPA-driven OIDC with a customer-provided IdP (Azure AD, Okta, Keycloak, etc.).
# When auth_mode is "oidc", set the oidc_* env vars on the controller task
# (OIDC_ISSUER, OIDC_AUDIENCE) and deploy /auth/config.json to the console container.
sso:
  auth_mode: "alb-cognito"
  # oidc:
  #   issuer: ""        # e.g. https://login.microsoftonline.com/{tenant}/v2.0
  #   client_id: ""
  #   audience: ""       # backend verifies aud claim against this

# Tenancy v2 cutover flag (Multi-Cloud Agent Import — P0a, workstream §1.2).
# false → controller reads/writes the v1 tables (today). Flip to true only
# after the migration script has copied v1→v2 under tenant=default and the
# write-freeze cutover (workstream T09) is ready.
# CUTOVER 2026-06-23: migrate_tenancy.py copied v1→v2 under tenant=default
# (registry/policies/sessions/signals). Data-plane tenant-scoping now LIVE under
# the single `default` tenant. Rollback: set false + cdk deploy.
tenancy_v2_enabled: true

# Multi-tenancy runtime identity rollout CEILING (LLD-26 §7.2). off → /v1/validate
# never resolves a JWT (pre-26). shadow → verify+log presented JWTs, do NOT route
# (no-token traffic still allowed). enforce → route verified tid; tokenless DENY
# (needs ~100% credential coverage + SDK JWT signing/LLD-23 first — DO NOT raise
# to enforce until the background agents sign tokens, or they will be denied).
# Raised to `enforce` 2026-06-24: the only live validate traffic is the three Acme
# agents, all signing under tenant `acme` (=enforce) with active credentials. Other
# registry agents are idle (0 recent validate sessions). Per-tenant gate still
# governs (effective = min(this, tenant.identity_mode)): `acme` enforces, Globex
# (`off`) and any tenant left at shadow/off are unaffected for their signed traffic.
tenant_identity_mode: enforce

# Residual uncredentialed-agent legacy-fallback window (LLD-26 / WS-B B1). 0 =
# disabled (tokenless validate under enforce DENYs immediately). Raise (e.g. 86400)
# only if a not-yet-credentialed agent must be tolerated during a flip.
identity_fallback_window_seconds: 0
# Explicit per-tenant S3 policy prefix (WS-B B3). false = legacy implicit layout;
# reads dual-read both, so flip on + run scripts/migrate_s3_policy_prefix.py to cut over.
s3_explicit_tenant_prefix: false

# Per-tenant validate-RPS quota enforcement (WS-E E2b). Safe to enable: inert
# until a tenant is in `enforce` with a registered credential AND has a
# max_validate_rps quota — for the current `default`/shadow fleet it's a no-op
# (fails open on counter errors regardless). Flipped on after the cutover soak.
quota_enforcement_enabled: true

# Platform-admin cross-tenant read consent ENFORCEMENT (WS-E E3 / §10 Q2). When
# true, a Sentra-staff per-tenant read DENIES (403) unless the target tenant has
# platform_read_consent=true. The immutable audit ledger writes regardless. Enabled
# on dev after granting consent to all active tenants (t_e1xm0m7g8f04s, acme).
platform_read_consent_enforced: true

# Cedar authorization engine (feature: cedar-policy). Rollout: shadow first
# (both true → Cedar runs alongside, legacy verdict stays live, discrepancies
# recorded as CedarShadowDiscrepancy), then cutover by flipping
# cedar_shadow_mode → false + cdk deploy. Requires the CT08 backfill so policies
# carry a .cedar co-artifact (else Cedar abstains → legacy enforces).
cedar_enabled: true
# CUTOVER 2026-06-13: shadow → off after a clean shadow window (780 comparisons
# on organic traffic, 0 disagreements; 19-case offline parity gate; 489 unit
# tests). CedarPolicyEngine is now the authoritative policy decision on the
# /v1/validate hot path. Rollback: set back to true (or cedar_enabled:false) +
# cdk deploy Sentra-DEV-Compute-Stack.
cedar_shadow_mode: false

# Legacy-engine retirement (WS-I I2 / LLD 28 §4.2). Conservative-OFF. While false,
# a Cedar ABSTAIN (agent without a .cedar co-artifact) falls back to the legacy
# engine — no un-enforced window during the CT08 backfill. Flip to true ONLY after
# the backfill verify (I3.2) confirms 0 policies with policy_format != cedar AND
# generator-version parity; the flip is founder-gated (I3.3), NOT done in code.
legacy_retired: false

# Deterministic local-floor kill-switch (WS-I I5 / LLD 28 §5.6). Default true: the
# edge evaluates the signed Cedar bundle locally. Set false (incident escape hatch)
# to route every call to the hosted /v1/validate path (network-required, fail-secure)
# — it does NOT disable enforcement (ADR-034). Per-tenant override via sentra-tenants.
local_floor_enabled: true

# ML threat classifier (WS-C / LLD 31 §6.5, task C7.2 — founder-requested). Turns the
# `sentra.ml_classifier` tier-1 node ON. With WS-C the classifier is OUT OF SHADOW —
# `ml_classifier_shadow_mode` is removed and the node ALWAYS enforces — so this flag is
# now the only gate on whether ML runs at all; it MUST be true for the ML DENY to block.
# Pre-launch (dev IS prod, no customer traffic yet); WS-F benign-FP graduation gate is the
# named safeguard before real traffic (LLD 31 §14.2).
ml_classifier_enabled: true

# ALB-OIDC signer/issuer PIN (WS-M M1.0 / lld/39 §3.1). The in-service control-plane
# auth boundary (ADR-037) verifies operator-console tokens with plain ES256, which
# accepts a token signed by ANY in-region ALB / ANY Cognito pool — acct 531109575379
# hosts multiple stacks, so a sibling ALB's token would otherwise verify. Populate
# both with THIS stack's ALB ARN + Cognito issuer to enforce the pin, then flip
# alb_oidc_pin_enforce_at_boot -> true so an unpinned deploy fails to boot.
#
# AS-1 discovery COMPLETE (2026-07-07, verified via `aws elbv2 describe-rules`):
# the authenticate-cognito ALB (the JWT SIGNER) is `sentra-public-alb`
# (arn .../app/sentra-public-alb/7687a95a29307d8c) — NOT the private ALB; its
# authenticate-cognito action targets Cognito pool us-east-1_IIMNeRWtA. AWS docs
# confirm the JWT header `signer` == the ALB ARN (this exact string). The signer
# pin is populated below; it fires on EVERY operator request the moment it is set
# (gated on non-empty pins, independent of the boot flag), closing the sibling-ALB
# forgery gap on acct 531109575379 immediately.
alb_oidc_expected_signers: "arn:aws:elasticloadbalancing:us-east-1:531109575379:loadbalancer/app/sentra-public-alb/7687a95a29307d8c"
# ISSUER pin held for a verified follow-up: the ALB's JWT `iss` for a Cognito pool
# is the pool issuer URL (expected: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_IIMNeRWtA),
# but the EXACT `iss` string the ALB emits must be confirmed against a live token
# before pinning, else a mismatch 401s every operator. Enable after log-verifying.
#   alb_oidc_expected_issuer: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_IIMNeRWtA"
#
# Boot-time enforcement (WS-M M1.0 FIX-B): compute_stack.py DEFAULTS
# ALB_OIDC_PIN_ENFORCE_AT_BOOT to true, and assert_alb_oidc_pin_ready_at_boot()
# raises at FastAPI lifespan startup when the flag is on with empty pins → the ECS
# task never becomes healthy → control-plane OUTAGE. This stack is live-prod
# (dev IS prod, acct 531109575379) with tenant_identity_mode:enforce, so leaving
# the flag at its true default while the pins are empty would BRICK the very next
# `cdk deploy` of the controller. HOLD it false for the transition window; flip to
# true ONLY once BOTH pins above are populated with the real values (the deploy
# runbook / CI still calls assert_alb_oidc_pin_ready_for_prod before flipping a
# money-movement tenant to enforce). Fail-secure intent is preserved: an unpinned
# boot-enforced deploy still refuses to start once the flag is raised.
alb_oidc_pin_enforce_at_boot: false

# VPC Configuration
vpc:
  cidr: "10.0.0.0/16"
  max_azs: 2
  nat_gateways: 1

  # Subnet Configuration
  # Note: Public subnets (/24) are hardcoded in network_stack.py for Public ALB + NAT Gateway
  # Actual subnet allocation:
  #   - Public: 10.0.1.0/24, 10.0.2.0/24 (for Public ALB + NAT, hardcoded)
  #   - Private: 10.0.11.0/24, 10.0.12.0/24 (for ECS + Private ALB, configured below)
  #   - Isolated: 10.0.21.0/28, 10.0.22.0/28 (for VPC Endpoints, configured below)
  subnets:
    private:
      - cidr_mask: 24  # 10.0.11.0/24 (us-east-1a) - ECS services + Private ALB
      - cidr_mask: 24  # 10.0.12.0/24 (us-east-1b) - ECS services + Private ALB
    isolated:
      - cidr_mask: 28  # 10.0.21.0/28 (us-east-1a) - VPC endpoints
      - cidr_mask: 28  # 10.0.22.0/28 (us-east-1b) - VPC endpoints

  # DNS Settings
  enable_dns_hostnames: true
  enable_dns_support: true

  # VPC Flow Logs
  flow_logs:
    enabled: true
    retention_days: 7

# Resource Naming
naming:
  prefix: "sentra-mvp"
  vpc_name: "sentra-mvp-vpc"

# Route53 Configuration
route53:
  private_zone_name: "sentra.internal"

# VPC Endpoints Configuration
vpc_endpoints:
  enabled: true

# Storage Configuration (Task 5-8)
storage:
  # CloudWatch Audit Logs (Task 5)
  audit_logs:
    log_group_name: "/sentra/audit-logs"
    retention_days: 90  # Compliance requirement (SOC2, HIPAA)

  # Container Logs (used in ComputeStack)
  container_logs:
    retention_days: 7  # Cost optimization

  # DynamoDB Tables (Task 6-7)
  dynamodb:
    billing_mode: "PAY_PER_REQUEST"  # On-demand pricing

    session_context:
      table_name: "sentra-session-context"
      ttl_hours: 24


    demo_orders:
      table_name: "sentra-demo-orders"

    demo_customers:
      table_name: "sentra-demo-customers"

    # Workstream 17 — Validation Signal Store (LLD 17 §5.2)
    # Per-validator signal substrate. Read-hot path for the dashboard;
    # CW audit logs kept as compliance archive (dual-write).
    validation_signals:
      table_name: "sentra-validation-signals"
      ttl_days: 90
      write_timeout_ms: 200
      batch_max_retries: 3
      retry_backoff_ms: [50, 200, 800]

  # S3 Bucket (Task 8)
  s3:
    bucket_name_prefix: "sentra-mvp-artifacts"
    versioning: true
    lifecycle_rules:
      compliance_archive_days: 30  # Archive to Glacier after 30 days
      debug_logs_delete_days: 7    # Delete debug logs after 7 days

# Cognito Configuration (Workstream 8)
cognito:
  user_pool_name: "sentra-dashboard-users"
  domain_prefix: "sentra-dashboard-mvp"  # Must be globally unique
  password_min_length: 12
  mfa_enabled: false  # Optional for MVP

# Compute Configuration (Task 9-12)
compute:
  # ECS Cluster (Task 9)
  ecs_cluster:
    cluster_name: "sentra-mvp-cluster"
    container_insights: true  # Enable CloudWatch Container Insights

  # ECR Repositories (Task 9)
  ecr:
    image_scan_on_push: true  # Enable vulnerability scanning
    lifecycle_max_images: 10  # Keep last 10 images per repository

  # ECS Task Configuration (Task 12)
  # Increased from 2048/4096 to handle concurrent demo scenarios
  ecs_tasks:
    cpu: 4096      # 4 vCPU (increased from 2)
    memory: 8192   # 8 GB RAM (increased from 4)
    desired_count: 1  # MVP: 1 task per service

  # ALB Configuration (Workstream 8 - Split ALB Architecture)
  alb:
    public:
      name: "sentra-public-alb"
      internet_facing: true
      enable_deletion_protection: false
    private:
      name: "sentra-private-alb"
      internet_facing: false
      enable_deletion_protection: false
    # WS-22: real *.aegionai.ai cert (replaces self-signed) + console host for routing
    certificate_arn: "arn:aws:acm:us-east-1:531109575379:certificate/522142fe-acef-4a68-8c59-847fc28b9470"
    console_host: "console.aegionai.ai"

# API Gateway Configuration (Task 13)
api_gateway:
  api_name: "sentra-mvp-api"
  stage_name: "prod"
  api_key_name: "sentra-demo-key"
  usage_plan_name: "sentra-mvp-usage-plan"
  vpc_link_name: "sentra-mvp-vpc-link"

  # Global throttling (per second)
  throttle_rate_limit: 100    # 100 req/sec
  throttle_burst_limit: 200   # 200 burst

  # Usage plan throttling (per second per key)
  usage_plan_rate_limit: 100   # 100 req/sec per API key
  usage_plan_burst_limit: 200  # 200 burst per API key

  # Quota settings
  # Raised 2026-06-13 from 100k → 2M: the live SOC console's polling
  # (metrics/decisions/threats auto-refresh) exhausted the 100k/month quota in
  # ~4 days (102,524 used → every call 429 "Limit Exceeded"). 2M gives ~66k/day
  # headroom vs the observed ~35k/day peak. ROOT-CAUSE follow-up: trim console
  # poll frequency so quota isn't the backstop for chatty polling.
  usage_plan_quota_limit: 2000000  # 2,000,000 requests per month

  # CORS settings (MVP: allow all origins)
  cors_allow_origins:
    - "*"
  cors_allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  cors_allow_headers:
    - "Content-Type"
    - "X-Amz-Date"
    - "Authorization"
    - "X-Api-Key"
    - "X-Amz-Security-Token"

  # Endpoint-specific rate limits (per minute)
  endpoints:
    health:
      rate_limit: 1000
      burst_limit: 2000
      auth_required: false
    validate:
      rate_limit: 100
      burst_limit: 200
      auth_required: true
    logs:
      rate_limit: 50
      burst_limit: 100
      auth_required: true
    rollback:
      rate_limit: 10
      burst_limit: 20
      auth_required: true
    agent_query:
      rate_limit: 20
      burst_limit: 40
      auth_required: true
    agent_action:
      rate_limit: 10
      burst_limit: 20
      auth_required: true

  # Monitoring and logging
  access_log_retention_days: 30
  enable_xray_tracing: true
  enable_metrics: true
  log_level: "INFO"
  data_trace_enabled: false  # Don't log request/response bodies (security)

# Monitoring Configuration (Task 14)
monitoring:
  dashboard_name: "sentra-mvp-dashboard"
  sns_topic_name: "sentra-mvp-alerts"
  alert_email: "admin@sentra.ai"  # Change this to your email address

  # Alarm thresholds
  alarms:
    api_5xx_threshold: 10          # API Gateway 5XX errors in 5 min
    api_latency_p99_ms: 5000       # API Gateway p99 latency (5 seconds)
    ecs_cpu_percent: 80            # ECS CPU utilization %
    ecs_memory_percent: 80         # ECS Memory utilization %
    dynamodb_throttle_count: 5     # DynamoDB throttled requests in 1 min
    high_severity_threats: 10      # High-severity threats in 5 min

# Tags (applied to all resources)
tags:
  Project: "Sentra"
  Environment: "dev"
  ManagedBy: "CDK"
  Owner: "Sentra-Team"
