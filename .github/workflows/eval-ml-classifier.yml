name: Eval ML Classifier

# WS19 M2 Task 2.4 — runs the eval harness on PRs that touch ML classifier
# code or prompts. Blocks merge if precision/recall/latency thresholds fail.
#
# Hits real Bedrock — needs AWS creds with bedrock:InvokeModel. Configure
# the AWS_OIDC_ROLE_ARN repo secret as a role assumable from GitHub OIDC
# (cross-account least-privilege; the role only needs bedrock:InvokeModel
# on the foundation models the eval covers).
#
# NOTE: this is intentionally NOT run on every PR — it costs Bedrock spend
# (~$2-5 per run on a 500-row dataset against Haiku 4.5) and takes 5-10 min.
# Gated on paths-touched.

on:
  pull_request:
    paths:
      - 'Sentra/src/security-controller/app/validators/ml_classifier.py'
      - 'Sentra/src/security-controller/app/validators/ml_classifier_prompts.py'
      - 'Sentra/src/security-controller/app/validators/ml_classifier_schema.py'
      - 'Sentra/scripts/eval_ml_classifier.py'
      - 'Sentra/scripts/eval_thresholds.yaml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Bedrock model ID to evaluate'
        default: 'anthropic.claude-haiku-4-5-20251001-v1:0'
        required: true
      dataset_s3_uri:
        description: 's3:// URI of the labeled holdout dataset (defaults to v1 baseline)'
        required: false

permissions:
  id-token: write    # for AWS OIDC
  contents: read
  pull-requests: write  # for the eval-summary comment

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install controller deps
        run: |
          python -m pip install --upgrade pip
          pip install -r Sentra/src/security-controller/requirements.txt
          pip install -r Sentra/src/security-controller/requirements-test.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: github-eval-ml-classifier
          aws-region: us-east-1

      - name: Download eval dataset from S3
        id: dataset
        env:
          # Pinned to the v1 baseline so eval comparisons stay apples-to-apples.
          # Bump the URI deliberately when promoting a new dataset version.
          DATASET_S3_URI: ${{ github.event.inputs.dataset_s3_uri || 's3://sentra-eval/ml-classifier/dataset-v1-baseline.holdout.jsonl' }}
        run: |
          aws s3 cp "$DATASET_S3_URI" /tmp/eval-dataset.jsonl
          echo "path=/tmp/eval-dataset.jsonl" >> $GITHUB_OUTPUT

      - name: Run eval harness with CI gate
        id: run_eval
        env:
          MODEL_ID: ${{ github.event.inputs.model || 'anthropic.claude-haiku-4-5-20251001-v1:0' }}
        run: |
          mkdir -p eval_results
          python Sentra/scripts/eval_ml_classifier.py \
            --dataset "${{ steps.dataset.outputs.path }}" \
            --model "$MODEL_ID" \
            --output-dir eval_results/ \
            --thresholds-yaml Sentra/scripts/eval_thresholds.yaml \
            --ci-gate \
            --concurrency 4

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-classifier-eval-results
          path: eval_results/

      - name: Post PR summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'eval_results';
            const mdFile = fs.readdirSync(dir).find(f => f.endsWith('.md'));
            if (!mdFile) {
              core.warning('no markdown report produced');
              return;
            }
            const body = '## ML Classifier Eval (WS19)\n\n' +
                         fs.readFileSync(path.join(dir, mdFile), 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
